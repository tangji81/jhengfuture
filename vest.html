/* 背心区域 */

.vest{

width:300px;

height:420px;

margin:auto;

background:#eef6ff;

border:4px solid #2f80ed;

border-radius:80px 80px 40px 40px;

position:relative;

}



.neck{

position:absolute;

top:-10px;

left:90px;

width:120px;

height:50px;

background:white;

border-radius:50px;

}




.sensor{

width:35px;

height:35px;

background:#2f80ed;

color:white;

border-radius:50%;

position:absolute;

display:flex;

align-items:center;

justify-content:center;

font-size:12px;

font-weight:bold;

}



.L1{

top:110px;

left:70px;

}



.L2{

top:180px;

left:70px;

}



.L3{

top:250px;

left:70px;

}



.R1{

top:110px;

right:70px;

}



.R2{

top:180px;

right:70px;

}



.R3{

top:250px;

right:70px;

}





.grid{

display:grid;

grid-template-columns:repeat(4,1fr);

gap:15px;

}



.item{

background:#eef6ff;

padding:20px;

border-radius:12px;

text-align:center;

}



.number{

font-size:22px;

font-weight:bold;

color:#0b3d91;

}
